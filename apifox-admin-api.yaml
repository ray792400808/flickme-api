components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Search: { name: search, in: query, schema: { type: string, maxLength: 100 } }
    Status: { name: status, in: query, schema: { type: string } }
    DateFrom: { name: dateFrom, in: query, schema: { type: integer, format: int64, description: Unix 秒级时间戳 } }
    DateTo: { name: dateTo, in: query, schema: { type: integer, format: int64, description: Unix 秒级时间戳 } }
    AccountId: { name: account, in: path, required: true, schema: { type: integer } }
    RoleId: { name: role, in: path, required: true, schema: { type: integer } }
    ApprovalId: { name: approval, in: path, required: true, schema: { type: integer } }
    DramaId: { name: drama, in: path, required: true, schema: { type: integer, format: int64 } }
    EpisodeId: { name: episode, in: path, required: true, schema: { type: integer } }
    CharacterId: { name: character, in: path, required: true, schema: { type: integer, format: int64 } }
    CandidateId: { name: candidate, in: path, required: true, schema: { type: string } }
    TagId: { name: tag, in: path, required: true, schema: { type: integer, format: int64 } }
    CommentId: { name: comment, in: path, required: true, schema: { type: string } }
    WordId: { name: word, in: path, required: true, schema: { type: string } }
    FilterId: { name: filter, in: path, required: true, schema: { type: string } }
    SlotId: { name: slot, in: path, required: true, schema: { type: string } }
    UserId: { name: user, in: path, required: true, schema: { type: string } }
    AdjustmentId: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    PlanId: { name: plan, in: path, required: true, schema: { type: string } }
    PackId: { name: pack, in: path, required: true, schema: { type: string } }
    CouponId: { name: coupon, in: path, required: true, schema: { type: string } }
    OrderId: { name: order, in: path, required: true, schema: { type: string } }
    ModelId: { name: model, in: path, required: true, schema: { type: string } }
    TierId: { name: tier, in: path, required: true, schema: { type: string } }
    TaskId: { name: task, in: path, required: true, schema: { type: string } }
    TemplateId: { name: template, in: path, required: true, schema: { type: string } }
    FeedbackId: { name: feedback, in: path, required: true, schema: { type: string } }
    DocumentId: { name: document, in: path, required: true, schema: { type: string } }
    VersionId: { name: version, in: path, required: true, schema: { type: string } }
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    JsonArray:
      required: true
      content:
        application/json:
          schema: { type: array, items: { type: object, additionalProperties: true } }
    EmailRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties: { email: { type: string, format: email } }
    ReasonRequest:
      required: false
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReasonRequest' }
    RequiredReasonRequest:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ReasonRequest' }
              - { required: [reason] }
    StatusReasonRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status, reason]
            properties:
              status: { type: string, enum: [active, banned] }
              reason: { type: string }
    EnabledRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [enabled]
            properties: { enabled: { type: boolean } }
    FileUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary }
              version: { type: string }
              language: { type: string }
              effectiveAt: { type: integer, format: int64, description: Unix 秒级时间戳 }
  responses:
    IncentiveSuccess:
      description: 激励配置响应，时间均为 Unix 秒；初始 published 为 null，watch 保存立即生效
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/IncentiveDocument' }
    Success:
      description: 请求成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Created:
      description: 创建成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Accepted:
      description: 已接受异步任务
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Deleted:
      description: 删除成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties: { deleted: { type: boolean, example: true } }
    PaginatedSuccess:
      description: 分页列表
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedEnvelope' }
    LoginSuccess:
      description: 登录成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/LoginResult' }
    ProfileSuccess:
      description: 当前管理员资料
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/AdminProfile' }
    Unauthorized:
      description: 未登录、令牌过期或账号不可用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: 参数验证失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorEnvelope' }
  schemas:
    SearchWord:
      type: object
      additionalProperties: false
      required: [id, names, enabled, starts_at, ends_at]
      properties:
        id: { type: string, maxLength: 100 }
        sort: { type: integer, minimum: 0, maximum: 2147483647, description: 原型顺序值；同值保持提交顺序。旧请求省略时按数组位置生成 }
        status: { type: string, enum: [draft, published], description: 新前端应明确提交；旧请求省略时按 published 兼容原整份发布行为 }
        names:
          type: object
          additionalProperties: false
          required: [en, zh-Hans, zh-Hant, es, pt, id, th]
          properties:
            en: { type: string, minLength: 1, maxLength: 200 }
            zh-Hans: { type: string, maxLength: 200 }
            zh-Hant: { type: string, maxLength: 200 }
            es: { type: string, maxLength: 200 }
            pt: { type: string, maxLength: 200 }
            id: { type: string, maxLength: 200 }
            th: { type: string, maxLength: 200 }
        enabled: { type: boolean }
        starts_at: { type: integer, format: int64, nullable: true, description: Unix 秒，未设置为 null }
        ends_at: { type: integer, format: int64, nullable: true, description: Unix 秒；两端均有值时必须大于 starts_at }
    IncentiveRevision:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1, description: 当前配置 revision；写入成功加 1，发布不加 1 }
    CheckinDay:
      type: object
      additionalProperties: false
      required: [id, day, reward]
      properties:
        id: { type: string, example: CK1 }
        day: { type: string, example: Day 1 }
        reward: { type: integer, minimum: 0, maximum: 1000000 }
    CheckinSave:
      allOf:
        - { $ref: '#/components/schemas/IncentiveRevision' }
        - type: object
          required: [draft]
          properties:
            draft:
              type: array
              minItems: 7
              maxItems: 7
              items: { $ref: '#/components/schemas/CheckinDay' }
    IncentiveTask:
      type: object
      additionalProperties: false
      properties:
        group: { type: string, enum: [新手任务, 观看任务, 日常任务] }
        name: { type: string, maxLength: 200, description: 非观看任务必填；观看任务按 sec 自动生成 }
        sec: { type: integer, minimum: 1, maximum: 86400, description: 观看任务必填；其他分组忽略并移除 }
        reward: { type: integer, minimum: 0, maximum: 1000000 }
        reset: { type: string, enum: [一次性, 每日] }
        en: { type: boolean }
    IncentiveTaskSave:
      allOf:
        - { $ref: '#/components/schemas/IncentiveRevision' }
        - type: object
          required: [task]
          properties:
            task:
              allOf:
                - { $ref: '#/components/schemas/IncentiveTask' }
                - { required: [group, reward, reset, en] }
    IncentiveTaskPatch:
      allOf:
        - { $ref: '#/components/schemas/IncentiveRevision' }
        - type: object
          required: [task]
          properties:
            task: { $ref: '#/components/schemas/IncentiveTask' }
    WatchReward:
      type: object
      additionalProperties: false
      required: [sec, coins, cap]
      properties:
        sec: { type: integer, minimum: 1, maximum: 86400, example: 5 }
        coins: { type: integer, minimum: 1, maximum: 1000000, example: 2 }
        cap: { type: integer, minimum: 1, maximum: 1000000, example: 600, description: 不小于 coins，仅限制实时奖励，不含任务奖励 }
    WatchRewardSave:
      allOf:
        - { $ref: '#/components/schemas/IncentiveRevision' }
        - type: object
          required: [draft]
          properties:
            draft: { $ref: '#/components/schemas/WatchReward' }
    IncentiveDocument:
      type: object
      required: [revision, published_revision, published_at, draft, published]
      properties:
        revision: { type: integer, example: 1 }
        published_revision: { type: integer, nullable: true }
        published_at: { type: integer, format: int64, nullable: true }
        draft:
          oneOf:
            - { type: array, minItems: 7, maxItems: 7, items: { $ref: '#/components/schemas/CheckinDay' } }
            - type: array
              items:
                type: object
                required: [id, group, name, reward, reset, en]
                properties:
                  id: { type: string, description: 服务端生成的任务标识 }
                  group: { type: string }
                  name: { type: string }
                  sec: { type: integer }
                  reward: { type: integer }
                  reset: { type: string }
                  en: { type: boolean }
            - { $ref: '#/components/schemas/WatchReward' }
        published: { nullable: true, description: 最近一次发布的完整 draft 快照，未发布为 null }
    SuccessEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: ok }
        data: { nullable: true }
    ErrorEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 404 }
        message: { type: string }
        data: { nullable: true }
    ValidationErrorEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 422 }
        message: { type: string }
        data:
          type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
    PaginatedEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: ok }
        data:
          type: object
          required: [data, current_page, last_page, per_page, total]
          properties:
            data: { type: array, items: { type: object, additionalProperties: true } }
            current_page: { type: integer }
            last_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, maxLength: 1024 }
    LoginResult:
      type: object
      required: [accessToken, expiresAt, email]
      properties:
        accessToken: { type: string, example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef }
        expiresAt: { type: integer, format: int64, description: Unix 秒级时间戳 }
        email: { type: string, format: email }
    ActivateRequest:
      type: object
      required: [token, password, password_confirmation]
      properties:
        token: { type: string, minLength: 64, maxLength: 64 }
        password: { type: string, format: password, minLength: 12, maxLength: 128 }
        password_confirmation: { type: string, format: password }
    AdminProfile:
      type: object
      required: [id, name, email, role, roleName, permissions]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, example: admin }
        roleName: { type: string, example: 超级管理员 }
        permissions:
          type: object
          additionalProperties: { type: string, enum: [r, rw] }
    AdminAccountWrite:
      type: object
      required: [name, email, role_key]
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        role_key: { type: string, example: ops }
        note: { type: string, nullable: true, maxLength: 1000 }
    AdminAccountUpdate:
      type: object
      required: [name, role_key, status]
      properties:
        name: { type: string, maxLength: 100 }
        role_key: { type: string }
        status: { type: string, enum: [active, disabled, pending] }
        note: { type: string, nullable: true, maxLength: 1000 }
    RolePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: object
          additionalProperties: { type: string, enum: [none, r, rw] }
          example: { overview: r, content: rw, system: none }
    ReasonRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 1000 }
    CoinAdjustmentRequest:
      type: object
      required: [uid, currency, delta, reason]
      properties:
        uid: { type: string }
        currency: { type: string, enum: [member_coins, bonus] }
        delta: { type: integer, description: 正数增加，负数扣减 }
        reason: { type: string, maxLength: 1000 }
    ModelWrite:
      type: object
      required: [name, kind, estimatedCost, costCap, enabled]
      properties:
        name: { type: string, maxLength: 100, example: Swing Ride }
        kind: { type: string, enum: [FREE, VIP] }
        estimatedCost: { type: integer, minimum: 0, example: 6 }
        costCap: { type: integer, minimum: 0, example: 10, description: VIP 模型可填 0 表示不封顶 }
        tagline: { type: string, maxLength: 255, example: Short · tender · slow-burn }
        isNew: { type: boolean, default: false }
        enabled: { type: boolean, default: true }
    ContentTag:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        key: { type: string, example: romance }
        name: { type: string, example: Romance }
        status: { type: string, enum: [active, disabled] }
    ContentCharacter:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Development Character 1 }
        status: { type: string, enum: [published, draft, unpublished] }
        cover_url: { type: string, nullable: true, example: /test-media/cover.svg }
        tags: { type: array, items: { $ref: '#/components/schemas/ContentTag' } }
    ContentDrama:
      allOf:
        - { $ref: '#/components/schemas/ContentCharacter' }
        - type: object
          properties:
            title: { type: string, example: Development Short 01 }
            is_playable: { type: boolean, example: true }
            video_url: { type: string, nullable: true, example: /test-media/sample.mp4 }
            heat: { type: integer, example: 105 }

