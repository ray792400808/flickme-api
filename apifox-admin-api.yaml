openapi: 3.0.3
info:
  title: Flickme Admin API
  version: 1.0.0
  description: |
    Flickme 管理后台接口定义，可直接导入 Apifox。
    已实现的运营位、业务用户、金币调整及内容查询接口统一响应为 code、message、data。
    成功 code=200、message=ok；失败保留对应 HTTP 状态码，业务码见 ResponseDef。
    请求体保留各接口业务字段，不添加 code/message/data 包装。校验错误位于 data.errors。
    所有绝对时间统一为 Unix 秒级整数时间戳（int64），未设置时间为 null。
    包括 created_at、updated_at、deleted_at、registered_at、published_at、expiresAt、starts_at、ends_at。
    前端显示：new Date(timestamp * 1000)；提交：Math.floor(date.getTime() / 1000)。
    `x-implementation-status: implemented` 表示当前 Laravel 项目已经实现；
    `planned` 表示根据 Flickme_Admin.html 原型规划、尚待开发。
servers:
  - url: http://localhost:8000/admin
    description: 本地开发环境
security:
  - bearerAuth: []
tags:
  - { name: 数据概览 }
  - { name: 内容管理/Short 剧库 }
  - { name: 内容管理/Stories 角色库 }
  - { name: 内容管理/AI 角色备选库 }
  - { name: 内容管理/标签与合集 }
  - { name: 内容管理/评论管理 }
  - { name: 运营位/首页分类 Chips }
  - { name: 运营位/热门池与排序 }
  - { name: 运营位/启动弹窗 }
  - { name: 运营位/搜索推荐词 }
  - { name: 运营位/Stories 筛选标签 }
  - { name: 运营位/推荐位配置 }
  - { name: 用户管理/用户列表 }
  - { name: 用户管理/金币调整 }
  - { name: 商业化/会员套餐 }
  - { name: 商业化/充值包 }
  - { name: 商业化/优惠券 }
  - { name: 商业化/金币规则 }
  - { name: 商业化/订单与流水 }
  - { name: AI 配置/模型管理 }
  - { name: AI 配置/记忆档位 }
  - { name: AI 配置/内容安全 }
  - { name: 激励任务/签到奖励 }
  - { name: 激励任务/任务配置 }
  - { name: 激励任务/实时观看奖励 }
  - { name: 消息与推送/推送任务 }
  - { name: 消息与推送/Live Activity 模板 }
  - { name: 消息与推送/通知默认与频控 }
  - { name: 客服与反馈/反馈与举报工单 }
  - { name: 系统设置/认证 }
  - { name: 系统设置/系统状态 }
  - { name: 系统设置/审批中心 }
  - { name: 系统设置/账号管理 }
  - { name: 系统设置/角色与权限 }
  - { name: 系统设置/操作日志 }
  - { name: 系统设置/协议管理 }

paths:
  /health:
    get:
      tags: [系统设置/系统状态]
      summary: 管理后台健康检查
      security: []
      x-implementation-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /system/info:
    get:
      tags: [系统设置/系统状态]
      summary: 获取服务运行信息
      x-implementation-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dashboard:
    get:
      tags: [数据概览]
      summary: 获取管理后台数据概览
      x-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/DateFrom' }
        - { $ref: '#/components/parameters/DateTo' }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /auth/login:
    post:
      tags: [系统设置/认证]
      summary: 管理员登录
      security: []
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/LoginSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/me:
    get:
      tags: [系统设置/认证]
      summary: 获取当前管理员
      x-implementation-status: implemented
      responses:
        '200': { $ref: '#/components/responses/ProfileSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [系统设置/认证]
      summary: 退出登录
      x-implementation-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/activate:
    post:
      tags: [系统设置/认证]
      summary: 激活管理员账号或设置新密码
      security: []
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/refresh:
    post:
      tags: [系统设置/认证]
      summary: 刷新登录令牌
      x-implementation-status: planned
      responses:
        '200': { $ref: '#/components/responses/LoginSuccess' }
  /auth/forgot-password:
    post:
      tags: [系统设置/认证]
      summary: 申请重置密码
      security: []
      x-implementation-status: planned
      requestBody: { $ref: '#/components/requestBodies/EmailRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/reset-password:
    post:
      tags: [系统设置/认证]
      summary: 使用重置令牌设置密码
      security: []
      x-implementation-status: planned
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /accounts:
    get:
      tags: [系统设置/账号管理]
      summary: 管理员账号列表
      x-implementation-status: implemented
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { name: role, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled, pending] } }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
    post:
      tags: [系统设置/账号管理]
      summary: 创建管理员账号
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAccountWrite' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /accounts/{account}:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    patch:
      tags: [系统设置/账号管理]
      summary: 修改管理员账号
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAccountUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [系统设置/账号管理]
      summary: 删除管理员账号
      x-implementation-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /accounts/{account}/reset-password:
    post:
      tags: [系统设置/账号管理]
      summary: 重置密码并生成激活令牌
      x-implementation-status: implemented
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /roles:
    get:
      tags: [系统设置/角色与权限]
      summary: 获取角色及权限矩阵
      x-implementation-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /roles/{role}:
    patch:
      tags: [系统设置/角色与权限]
      summary: 修改角色权限
      x-implementation-status: implemented
      parameters:
        - { $ref: '#/components/parameters/RoleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolePermissionsRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /approval-requests:
    get:
      tags: [系统设置/审批中心]
      summary: 审批单列表
      x-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/Status' }
        - { name: resourceType, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
  /approval-requests/{approval}:
    get:
      tags: [系统设置/审批中心]
      summary: 审批单详情及变更差异
      x-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/ApprovalId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /approval-requests/{approval}/approve:
    post:
      tags: [系统设置/审批中心]
      summary: 审批通过
      x-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/ApprovalId' }
      requestBody: { $ref: '#/components/requestBodies/ReasonRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /approval-requests/{approval}/reject:
    post:
      tags: [系统设置/审批中心]
      summary: 驳回审批
      x-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/ApprovalId' }
      requestBody: { $ref: '#/components/requestBodies/RequiredReasonRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /dramas:
    get:
      tags: [内容管理/Short 剧库]
      summary: 分页查询Short 剧集
      description: 需要 content 或 ops 的 r/rw 权限。ID 为正整数。available=1 仅返回 published、is_playable=true 且视频地址非空的剧集。
      x-implementation-status: implemented
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: ID 精确匹配或名称包含匹配 }
        - { name: tag_key, in: query, schema: { type: string, example: romance }, description: 按关联标签 key 筛选内容；不存在的 key 返回空列表 }
        - { name: status, in: query, schema: { type: string, enum: [published, draft, unpublished] } }
        - { name: available, in: query, schema: { type: boolean }, description: 通过 1/0 表示是否仅查询可用内容 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200':
          description: 双层分页列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ContentDrama' }
                      current_page: { type: integer }
                      per_page: { type: integer }
                      last_page: { type: integer }
                      total: { type: integer }
              example: {"data":{"data":[{"id":1,"name":"Development Short 01","title":"Development Short 01","status":"published","cover_url":"/test-media/cover.svg","video_url":"/test-media/sample.mp4","is_playable":true,"heat":105,"tags":[{"id":1,"key":"romance","name":"Romance","status":"active"},{"id":2,"key":"ceo","name":"Ceo","status":"active"}]}],"current_page":1,"per_page":10,"last_page":1,"total":1}}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: 参数校验失败 }
    post:
      tags: [内容管理/Short 剧库]
      summary: 新建 Short 剧集
      x-implementation-status: planned
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /dramas/{drama}:
    parameters:
      - { $ref: '#/components/parameters/DramaId' }
    get:
      tags: [内容管理/Short 剧库]
      summary: 获取Short 剧集详情
      description: 需要 content 或 ops 的 r/rw 权限。ID 为正整数。available=1 仅返回 published、is_playable=true 且视频地址非空的剧集。
      x-implementation-status: implemented
      responses:
        '200':
          description: 内容详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContentDrama'
              example: {"data":{"id":1,"name":"Development Short 01","title":"Development Short 01","status":"published","cover_url":"/test-media/cover.svg","video_url":"/test-media/sample.mp4","is_playable":true,"heat":105,"tags":[{"id":1,"key":"romance","name":"Romance","status":"active"},{"id":2,"key":"ceo","name":"Ceo","status":"active"}]}}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 记录不存在 }
    patch:
      tags: [内容管理/Short 剧库]
      summary: 修改 Short 剧集
      x-implementation-status: planned
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [内容管理/Short 剧库]
      summary: 删除草稿剧集
      x-implementation-status: planned
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
  /dramas/{drama}/{action}:
    post:
      tags: [内容管理/Short 剧库]
      summary: 提交、审批、驳回、上架或下架剧集
      description: action 可取 submit、approve、reject、publish、unpublish。
      x-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/DramaId' }
        - { name: action, in: path, required: true, schema: { type: string, enum: [submit, approve, reject, publish, unpublish] } }
      requestBody: { $ref: '#/components/requestBodies/ReasonRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /dramas/{drama}/episodes:
    get:
      tags: [内容管理/Short 剧库]
      summary: 分集列表
      x-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/DramaId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [内容管理/Short 剧库]
      summary: 新增分集
      x-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/DramaId' }
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /dramas/{drama}/episodes/batch:
    post:
      tags: [内容管理/Short 剧库]
      summary: 批量导入分集
      x-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/DramaId' }
      requestBody: { $ref: '#/components/requestBodies/JsonArray' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /dramas/{drama}/episodes/{episode}:
    parameters:
      - { $ref: '#/components/parameters/DramaId' }
      - { $ref: '#/components/parameters/EpisodeId' }
    patch:
      tags: [内容管理/Short 剧库]
      summary: 修改分集
      x-implementation-status: planned
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [内容管理/Short 剧库]
      summary: 删除分集
      x-implementation-status: planned
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
  /dramas/{drama}/episodes/{episode}/video:
    post:
      tags: [内容管理/Short 剧库]
      summary: 上传或替换分集视频
      x-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/DramaId' }
        - { $ref: '#/components/parameters/EpisodeId' }
      requestBody: { $ref: '#/components/requestBodies/FileUpload' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
  /dramas/{drama}/episodes/{episode}/published:
    patch:
      tags: [内容管理/Short 剧库]
      summary: 设置分集上架状态
      x-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/DramaId' }
        - { $ref: '#/components/parameters/EpisodeId' }
      requestBody: { $ref: '#/components/requestBodies/EnabledRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /characters:
    get:
      tags: [内容管理/Stories 角色库]
      summary: 分页查询Stories 角色
      description: 需要 content 或 ops 的 r/rw 权限。ID 为正整数。
      x-implementation-status: implemented
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: ID 精确匹配或名称包含匹配 }
        - { name: tag_key, in: query, schema: { type: string, example: romance }, description: 按关联标签 key 筛选内容；不存在的 key 返回空列表 }
        - { name: status, in: query, schema: { type: string, enum: [published, draft, unpublished] } }
        - { name: available, in: query, schema: { type: boolean }, description: 通过 1/0 表示是否仅查询可用内容 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200':
          description: 双层分页列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ContentCharacter' }
                      current_page: { type: integer }
                      per_page: { type: integer }
                      last_page: { type: integer }
                      total: { type: integer }
              example: {"data":{"data":[{"id":1,"name":"Development Character 1","status":"published","cover_url":"/test-media/cover.svg","tags":[{"id":1,"key":"romance","name":"Romance","status":"active"}]}],"current_page":1,"per_page":10,"last_page":1,"total":1}}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: 参数校验失败 }
    post:
      tags: [内容管理/Stories 角色库]
      summary: 新建角色
      x-implementation-status: planned
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '201': { $ref: '#/components/responses/Created' } }
  /characters/{character}:
    parameters: [{ $ref: '#/components/parameters/CharacterId' }]
    get:
      tags: [内容管理/Stories 角色库]
      summary: 获取Stories 角色详情
      description: 需要 content 或 ops 的 r/rw 权限。ID 为正整数。
      x-implementation-status: implemented
      responses:
        '200':
          description: 内容详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContentCharacter'
              example: {"data":{"id":1,"name":"Development Character 1","status":"published","cover_url":"/test-media/cover.svg","tags":[{"id":1,"key":"romance","name":"Romance","status":"active"}]}}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 记录不存在 }
    patch:
      tags: [内容管理/Stories 角色库]
      summary: 修改角色
      x-implementation-status: planned
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [内容管理/Stories 角色库]
      summary: 删除草稿角色
      x-implementation-status: planned
      responses: { '200': { $ref: '#/components/responses/Deleted' } }
  /characters/{character}/{action}:
    post:
      tags: [内容管理/Stories 角色库]
      summary: 提交、审批、驳回、上架或下架角色
      x-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/CharacterId' }
        - { name: action, in: path, required: true, schema: { type: string, enum: [submit, approve, reject, publish, unpublish] } }
      requestBody: { $ref: '#/components/requestBodies/ReasonRequest' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /character-candidates:
    get:
      tags: [内容管理/AI 角色备选库]
      summary: AI 角色备选列表
      x-implementation-status: planned
      parameters: [{ $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/Page' }]
      responses: { '200': { $ref: '#/components/responses/PaginatedSuccess' } }
  /dramas/{drama}/generate-characters:
    post:
      tags: [内容管理/AI 角色备选库]
      summary: 从指定短剧生成角色
      x-implementation-status: planned
      parameters: [{ $ref: '#/components/parameters/DramaId' }]
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '202': { $ref: '#/components/responses/Accepted' } }
  /dramas/generate-missing-characters:
    post:
      tags: [内容管理/AI 角色备选库]
      summary: 为缺少角色的上架短剧批量生成
      x-implementation-status: planned
      responses: { '202': { $ref: '#/components/responses/Accepted' } }
  /character-candidates/{candidate}/{action}:
    post:
      tags: [内容管理/AI 角色备选库]
      summary: 接受、忽略或删除备选角色
      x-implementation-status: planned
      parameters:
